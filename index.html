<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitQuest — Constância em Treino e Dieta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1220; --bg2:#171b2e; --card:#1c2138; --card2:#242a45;
  --border:#2e3555; --text:#eef0fb; --text-dim:#9aa1c2;
  --accent:#7c5cff; --accent2:#ff6b9d; --green:#3ddc97; --yellow:#ffc857; --red:#ff5c72;
  --blue:#4dabf7;
  --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);}
h1,h2,h3,h4{margin:0 0 10px 0;}
.app{max-width:1100px;margin:0 auto;padding:14px 14px 90px 14px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 16px 4px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;}
.xpbar-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 14px;}
.level-badge{background:linear-gradient(135deg,var(--yellow),#ff8c42);color:#1a1200;font-weight:800;border-radius:999px;padding:3px 10px;font-size:13px;}
.xp-track{width:140px;height:8px;background:var(--card2);border-radius:6px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--yellow);}

nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--border);}
nav.tabs button{background:transparent;border:none;color:var(--text-dim);padding:10px 14px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;white-space:nowrap;}
nav.tabs button.active{color:var(--text);background:var(--card);border-bottom:3px solid var(--accent);}
nav.tabs button:hover{color:var(--text);}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.stat{background:var(--card2);border-radius:12px;padding:14px;text-align:center;border:1px solid var(--border);}
.stat .val{font-size:24px;font-weight:800;}
.stat .lbl{color:var(--text-dim);font-size:12px;margin-top:4px;}

.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;}
.btn:hover{filter:brightness(1.1);}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--red);}
.btn.small{padding:6px 12px;font-size:13px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:12px;color:var(--text-dim);font-weight:600;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row > *{flex:1;min-width:120px;}

.quest{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);}
.quest.done{border-color:var(--green);background:rgba(61,220,151,.08);}
.quest .icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card);}
.quest .info{flex:1;}
.quest .info .t{font-weight:700;font-size:14px;}
.quest .info .d{font-size:12px;color:var(--text-dim);}
.quest .xp-pill{font-size:12px;font-weight:700;color:var(--yellow);}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check.on{background:var(--green);border-color:var(--green);color:#04160f;font-weight:900;}

.rating{display:flex;gap:6px;}
.rating .rb{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text-dim);font-weight:700;}
.rating .rb.sel{background:var(--accent);color:#fff;border-color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--text-dim);font-weight:600;font-size:12px;}
tr:hover td{background:rgba(255,255,255,.02);}
.badgechip{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;margin:2px;}
.badgechip.earned{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.photo-card{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--card2);cursor:pointer;}
.photo-card img{width:100%;height:160px;object-fit:cover;display:block;}
.photo-card .cap{padding:6px 8px;font-size:11px;color:var(--text-dim);}
.photo-card .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:6px;width:22px;height:22px;font-size:12px;}
.compare-wrap{display:flex;gap:14px;flex-wrap:wrap;}
.compare-col{flex:1;min-width:220px;text-align:center;}
.compare-col img{width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:#000;}

.badge-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:999;animation:pop .4s ease;}
@keyframes pop{from{transform:translateX(-50%) translateY(20px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}

.muted{color:var(--text-dim);font-size:13px;}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
.tag.ok{background:rgba(61,220,151,.15);color:var(--green);}
.tag.warn{background:rgba(255,200,87,.15);color:var(--yellow);}
.tag.bad{background:rgba(255,92,114,.15);color:var(--red);}
.hidden{display:none !important;}
.chart-box{position:relative;height:280px;}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0;}
.result-box{background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-top:12px;}
.macro-bar{height:22px;border-radius:6px;overflow:hidden;display:flex;margin-top:6px;}
.macro-bar div{height:100%;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   FitQuest — App local de constância fitness (gamificado)
   Dados 100% locais (localStorage). Sem servidor/backend.
   ========================================================= */

const LS_KEY = 'fitquest_data_v1';

const DEFAULT_DATA = {
  profile: {
    name:'', sex:'M', height:176, birthYear:2000, activity:'moderate',
    tmbFormula:'mifflin', proteinPerKg:2.2, fatPercent:0.30,
    goal: { type:'cut', targetWeight:null, targetDate:null, weeklyRatePct:0.5 }
  },
  weights: [],       // {date, weight}
  measurements: [],  // {date, waist, neck, hip, chest, arm, thigh, calf}
  photos: [],        // {date, img(base64), weight, note}
  daily: [],         // {date, trainingDone, trainingRating, sleepHours, sleepQuality, nutritionRating, notes}
  gami: { xp:0, badges:[] },
  lastVisit: null
};

let DATA = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed, {
      profile: Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA.profile)), parsed.profile||{}, {
        goal: Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA.profile.goal)), (parsed.profile&&parsed.profile.goal)||{})
      })
    });
  }catch(e){ console.error(e); return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveData(){ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }

function todayStr(d){ const x = d||new Date(); return x.toISOString().slice(0,10); }
function fmtDate(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------- GAMIFICATION ---------- */
const XP_RULES = { weight:10, training:10, sleep:10, nutrition:10, measurement:20, photo:15 };
const LEVEL_STEP = 120; // xp per level

function levelInfo(xp){
  const level = Math.floor(xp/LEVEL_STEP)+1;
  const cur = xp - (level-1)*LEVEL_STEP;
  return { level, cur, need:LEVEL_STEP, pct: Math.min(100, Math.round(cur/LEVEL_STEP*100)) };
}
function addXp(amount, reason){
  DATA.gami.xp += amount;
  saveData();
  checkBadges();
}

function currentStreak(){
  // streak = consecutive days (ending today or yesterday) with ANY daily log entry
  const dates = new Set(DATA.daily.map(d=>d.date));
  DATA.weights.forEach(w=>dates.add(w.date));
  let streak = 0;
  let d = new Date();
  // allow today to be "not yet logged" without breaking streak from yesterday
  let cursor = new Date();
  if(!dates.has(todayStr(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  while(dates.has(todayStr(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

const BADGE_DEFS = [
  {id:'first_log', name:'Primeiro Passo', desc:'Registrou o primeiro check-in diário', test: d=>d.daily.length>=1},
  {id:'streak7', name:'7 Dias de Fogo', desc:'7 dias seguidos de constância', test: d=>currentStreak()>=7},
  {id:'streak30', name:'Guerreiro Mensal', desc:'30 dias seguidos de constância', test: d=>currentStreak()>=30},
  {id:'streak100', name:'Lenda da Rotina', desc:'100 dias seguidos', test: d=>currentStreak()>=100},
  {id:'first_photo', name:'Antes & Depois', desc:'Enviou a primeira foto de progresso', test: d=>d.photos.length>=1},
  {id:'photos5', name:'Registro Visual', desc:'5 fotos de progresso registradas', test: d=>d.photos.length>=5},
  {id:'first_measure', name:'Fita Métrica', desc:'Primeira avaliação de medidas', test: d=>d.measurements.length>=1},
  {id:'weights10', name:'Consistente', desc:'10 pesagens registradas', test: d=>d.weights.length>=10},
  {id:'weights50', name:'Disciplina de Ferro', desc:'50 pesagens registradas', test: d=>d.weights.length>=50},
  {id:'lost2', name:'Rumo ao Objetivo', desc:'Progresso de 2kg na direção da meta', test: d=>goalProgressKg(d)>=2},
  {id:'lost5', name:'Transformação', desc:'Progresso de 5kg na direção da meta', test: d=>goalProgressKg(d)>=5},
];
function goalProgressKg(d){
  const ws = [...d.weights].sort((a,b)=>a.date.localeCompare(b.date));
  if(ws.length<2) return 0;
  const first = ws[0].weight, last = ws[ws.length-1].weight;
  const goal = d.profile.goal;
  if(goal.type==='cut') return Math.max(0, first-last);
  if(goal.type==='bulk') return Math.max(0, last-first);
  return 0;
}
function checkBadges(){
  let newly = [];
  BADGE_DEFS.forEach(b=>{
    if(!DATA.gami.badges.includes(b.id) && b.test(DATA)){
      DATA.gami.badges.push(b.id);
      newly.push(b);
    }
  });
  if(newly.length){ saveData(); newly.forEach(b=>showBadgeToast(b)); }
}
function showBadgeToast(b){
  const el = document.createElement('div');
  el.className='badge-toast';
  el.textContent = `🏆 Conquista desbloqueada: ${b.name}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------- CALC: BODY FAT (US Navy), LEAN MASS, BMI ---------- */
function calcBF(sex, waist, neck, hip, heightCm){
  if(!waist || !neck || !heightCm) return null;
  if(sex==='M'){
    if(waist<=neck) return null;
    return 495/(1.0324 - 0.19077*Math.log10(waist-neck) + 0.15456*Math.log10(heightCm)) - 450;
  } else {
    if(!hip || (waist+hip)<=neck) return null;
    return 495/(1.29579 - 0.35004*Math.log10(waist+hip-neck) + 0.22100*Math.log10(heightCm)) - 450;
  }
}
function calcBMI(weight, heightCm){ const h=heightCm/100; return weight/(h*h); }
function bmiClass(bmi){
  if(bmi<18.5) return {t:'Abaixo do peso', cls:'warn'};
  if(bmi<25) return {t:'Peso normal', cls:'ok'};
  if(bmi<30) return {t:'Sobrepeso', cls:'warn'};
  return {t:'Obesidade', cls:'bad'};
}

/* ---------- CALC: TDEE FORMULAS ---------- */
function getAge(birthYear){ return new Date().getFullYear()-birthYear; }

function tmbFormulas(weight, heightCm, age, sex, leanMass){
  const hb = sex==='M'
    ? 66.473 + 13.7516*weight + 5.0033*heightCm - 6.755*age
    : 655.0955 + 9.5634*weight + 1.8496*heightCm - 4.6756*age;
  const mifflin = sex==='M'
    ? (10*weight + 6.25*heightCm - 5*age + 5)
    : (10*weight + 6.25*heightCm - 5*age - 161);
  const cunningham = leanMass ? (22*leanMass + 500) : null;
  const tinsleyLBM = leanMass ? (25.9*leanMass + 284) : null;
  const tinsleyWeight = 24.8*weight + 10;
  return { harris: hb, mifflin, cunningham, tinsley: leanMass ? tinsleyLBM : tinsleyWeight };
}
const ACTIVITY_FACTORS = {
  sedentary:{label:'Sedentário (pouco ou nenhum exercício)', f:1.2},
  light:{label:'Levemente ativo (1-3x/semana)', f:1.375},
  moderate:{label:'Moderadamente ativo (3-5x/semana)', f:1.55},
  active:{label:'Muito ativo (6-7x/semana)', f:1.725},
  veryactive:{label:'Extremamente ativo (2x/dia, trabalho físico)', f:1.9},
};

function computeMacros(kcal, weight, proteinPerKg, fatPercent){
  const proteinG = proteinPerKg*weight;
  const proteinKcal = proteinG*4;
  const fatKcal = kcal*fatPercent;
  const fatG = fatKcal/9;
  const carbKcal = Math.max(0, kcal - proteinKcal - fatKcal);
  const carbG = carbKcal/4;
  const fiberMin = Math.round(10*(kcal/1000));
  const fiberMax = Math.round(15*(kcal/1000));
  return { proteinG, fatG, carbG, fiberMin, fiberMax, proteinKcal, fatKcal, carbKcal };
}

/* ---------- CALC: TIME ESTIMATE FOR GOAL ---------- */
function estimateGoalWeeks(currentWeight, targetWeight, weeklyRatePct){
  const diff = targetWeight - currentWeight; // + bulk, - cut
  const weeklyKg = currentWeight*(weeklyRatePct/100);
  if(weeklyKg===0) return null;
  const weeks = diff/ (diff>=0? weeklyKg : -weeklyKg);
  return weeks;
}
function safeRateTag(pct){
  if(pct<=0) return {t:'-', cls:''};
  if(pct<=1) return {t:'Seguro', cls:'ok'};
  if(pct<=1.5) return {t:'Agressivo', cls:'warn'};
  return {t:'Arriscado', cls:'bad'};
}

/* ============================================================
   RENDER / ROUTER
   ============================================================ */
let currentTab = 'dashboard';

function render(){
  const app = document.getElementById('app');
  const li = levelInfo(DATA.gami.xp);
  const streak = currentStreak();
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="logo">💪</div> FitQuest</div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="streak">🔥 ${streak}</div>
        <div class="xpbar-wrap">
          <span class="level-badge">Nv. ${li.level}</span>
          <div class="xp-track"><div class="xp-fill" style="width:${li.pct}%"></div></div>
          <span class="muted" style="font-size:12px;">${li.cur}/${li.need} XP</span>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div id="tabcontent"></div>
  `;
  const tabs = [
    ['dashboard','🏠 Dashboard'],
    ['weight','⚖️ Peso & Medidas'],
    ['photos','📸 Fotos'],
    ['calc','🧮 Calculadora'],
    ['badges','🏆 Conquistas'],
    ['settings','⚙️ Config']
  ];
  const nav = document.getElementById('tabs');
  nav.innerHTML = tabs.map(([id,label])=>`<button data-tab="${id}" class="${currentTab===id?'active':''}">${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ currentTab=b.dataset.tab; render(); });

  const c = document.getElementById('tabcontent');
  if(currentTab==='dashboard') renderDashboard(c);
  else if(currentTab==='weight') renderWeight(c);
  else if(currentTab==='photos') renderPhotos(c);
  else if(currentTab==='calc') renderCalc(c);
  else if(currentTab==='badges') renderBadges(c);
  else if(currentTab==='settings') renderSettings(c);
}

/* ---------------- DASHBOARD ---------------- */
function todayDaily(){
  const t = todayStr();
  let d = DATA.daily.find(x=>x.date===t);
  if(!d){ d = {date:t, trainingDone:null, trainingRating:null, sleepHours:null, sleepQuality:null, nutritionRating:null, notes:''}; }
  return d;
}
function upsertDaily(d){
  const idx = DATA.daily.findIndex(x=>x.date===d.date);
  if(idx>=0) DATA.daily[idx]=d; else DATA.daily.push(d);
  saveData();
}
function todayWeight(){
  const t = todayStr();
  const w = DATA.weights.find(x=>x.date===t);
  return w? w.weight : null;
}

function renderDashboard(c){
  const d = todayDaily();
  const tw = todayWeight();
  const ws = [...DATA.weights].sort((a,b)=>a.date.localeCompare(b.date));
  const last7 = ws.slice(-7);
  const avg7 = last7.length? (last7.reduce((s,x)=>s+x.weight,0)/last7.length).toFixed(1) : '-';
  const lastW = ws.length? ws[ws.length-1].weight : null;
  const goal = DATA.profile.goal;

  c.innerHTML = `
    <div class="grid grid-4">
      <div class="stat"><div class="val">${lastW!==null?lastW.toFixed(1)+' kg':'-'}</div><div class="lbl">Último peso</div></div>
      <div class="stat"><div class="val">${avg7} kg</div><div class="lbl">Média 7 dias</div></div>
      <div class="stat"><div class="val">${currentStreak()} 🔥</div><div class="lbl">Streak (dias)</div></div>
      <div class="stat"><div class="val">${DATA.gami.badges.length}/${BADGE_DEFS.length}</div><div class="lbl">Conquistas</div></div>
    </div>

    <div class="card">
      <h3>Check-in de hoje — ${fmtDate(todayStr())}</h3>
      <div class="quest ${tw!==null?'done':''}" id="q-weight">
        <div class="icon">⚖️</div>
        <div class="info"><div class="t">Registrar peso</div><div class="d">${tw!==null? 'Registrado: '+tw+' kg' : 'Ainda não registrado hoje'}</div></div>
        <div class="xp-pill">+${XP_RULES.weight} XP</div>
        <div class="check ${tw!==null?'on':''}">${tw!==null?'✓':''}</div>
      </div>
      <div class="row" style="margin:-4px 0 14px 0;" id="weight-quick-row">
        <input type="number" step="0.1" id="quickWeightInput" placeholder="Peso hoje (kg)" value="${tw!==null?tw:''}">
        <button class="btn" id="quickWeightSave">Salvar peso</button>
      </div>

      <div class="quest ${d.trainingDone!==null?'done':''}">
        <div class="icon">🏋️</div>
        <div class="info"><div class="t">Treino do dia</div><div class="d">Você treinou hoje?</div></div>
        <div class="xp-pill">+${XP_RULES.training} XP</div>
        <div class="check ${d.trainingDone!==null?'on':''}">${d.trainingDone!==null?'✓':''}</div>
      </div>
      <div class="row" style="margin:-4px 0 8px 0;">
        <button class="btn ${d.trainingDone===true?'':'secondary'} small" id="trainYes">Treinei ✅</button>
        <button class="btn ${d.trainingDone===false?'':'secondary'} small" id="trainNo">Não treinei ❌</button>
      </div>
      <div class="field" id="trainRatingWrap" style="${d.trainingDone===null?'display:none':''}">
        <label>Qualidade do treino (1-5)</label>
        <div class="rating" id="trainRating">${[1,2,3,4,5].map(n=>`<button class="rb ${d.trainingRating===n?'sel':''}" data-v="${n}">${n}</button>`).join('')}</div>
      </div>

      <hr class="sep">

      <div class="quest ${d.sleepHours!==null?'done':''}">
        <div class="icon">😴</div>
        <div class="info"><div class="t">Sono</div><div class="d">Horas dormidas e qualidade</div></div>
        <div class="xp-pill">+${XP_RULES.sleep} XP</div>
        <div class="check ${d.sleepHours!==null?'on':''}">${d.sleepHours!==null?'✓':''}</div>
      </div>
      <div class="row">
        <input type="number" step="0.5" id="sleepHours" placeholder="Horas de sono" value="${d.sleepHours!==null?d.sleepHours:''}">
        <div class="rating" id="sleepQuality">${[1,2,3,4,5].map(n=>`<button class="rb ${d.sleepQuality===n?'sel':''}" data-v="${n}">${n}</button>`).join('')}</div>
      </div>

      <hr class="sep">

      <div class="quest ${d.nutritionRating!==null?'done':''}">
        <div class="icon">🍎</div>

function renderGoalMini(currentWeight){
  const goal = DATA.profile.goal;
  if(!currentWeight) return `<div class="card muted">Registre seu peso para ver o progresso até a meta.</div>`;
  const weeks = estimateGoalWeeks(currentWeight, goal.targetWeight, goal.weeklyRatePct);
  const diff = (goal.targetWeight - currentWeight).toFixed(1);
  const rate = safeRateTag(goal.weeklyRatePct);
  let etaTxt = '-';
  if(weeks!==null && isFinite(weeks) && weeks>0){
    const etaDate = new Date(); etaDate.setDate(etaDate.getDate()+Math.round(weeks*7));
    etaTxt = `${Math.ceil(weeks)} semanas (~${todayStrFormatted(etaDate)})`;
  }
  return `<div class="card">
    <h3>🎯 Meta: ${goal.targetWeight} kg (${goal.type==='cut'?'emagrecer':goal.type==='bulk'?'ganhar massa':'manter'})</h3>
    <div class="grid grid-3">
      <div class="stat"><div class="val">${diff>0?'+':''}${diff} kg</div><div class="lbl">Faltam para meta</div></div>
      <div class="stat"><div class="val">${etaTxt}</div><div class="lbl">Previsão de prazo</div></div>
      <div class="stat"><div class="val"><span class="tag ${rate.cls}">${rate.t}</span></div><div class="lbl">Ritmo (${goal.weeklyRatePct}%/sem)</div></div>
    </div>
  </div>`;
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height*=maxDim/width; width=maxDim; }
        else if(height>maxDim){ width*=maxDim/height; height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    else { const d=new Date(); d.setDate(d.getDate()+Math.round(weeks*7)); txt = `${Math.ceil(weeks)} semanas (~${todayStrFormatted(d)})`; }
  }
  return `<div class="result-box"><b>Estimativa:</b> ${txt} — ritmo <span class="tag ${rate.cls}">${rate.t}</span></div>`;
}
function showCalcResult(weight, leanMass){
  const p = DATA.profile;
  const age = getAge(p.birthYear);
  const t = tmbFormulas(weight, p.height, age, p.sex, leanMass);
  let tmb = t.mifflin;
  if(p.tmbFormula==='harris') tmb=t.harris;
  else if(p.tmbFormula==='cunningham') tmb = t.cunningham || t.mifflin;
  else if(p.tmbFormula==='tinsley') tmb = t.tinsley;
  const af = ACTIVITY_FACTORS[p.activity].f;
  const tdee = tmb*af;
  const weeklyKg = weight*(p.goal.weeklyRatePct/100);
  const dailyDelta = p.goal.type==='maintain'? 0 : (7700*weeklyKg)/7 * (p.goal.type==='cut'?-1:1);
  const target = Math.max(1000, tdee + dailyDelta);
  const macros = computeMacros(target, weight, p.proteinPerKg, p.fatPercent);
  const proteinPct = Math.round(macros.proteinKcal/target*100);
  const fatPct = Math.round(macros.fatKcal/target*100);
  const carbPct = Math.max(0,100-proteinPct-fatPct);

  document.getElementById('calcResult').innerHTML = `
    <div class="result-box">
      <div class="grid grid-4">
        <div class="stat"><div class="val">${Math.round(tmb)}</div><div class="lbl">TMB (kcal)</div></div>
        <div class="stat"><div class="val">${Math.round(tdee)}</div><div class="lbl">GET/TDEE (kcal)</div></div>
        <div class="stat"><div class="val">${dailyDelta>=0?'+':''}${Math.round(dailyDelta)}</div><div class="lbl">Ajuste diário</div></div>
        <div class="stat"><div class="val">${Math.round(target)}</div><div class="lbl">Meta calórica (kcal/dia)</div></div>
      </div>
      <h4 style="margin-top:16px;">Macronutrientes</h4>
      <div class="macro-bar">
        <div style="width:${proteinPct}%;background:#7c5cff;" title="Proteína"></div>
        <div style="width:${carbPct}%;background:#3ddc97;" title="Carboidrato"></div>
        <div style="width:${fatPct}%;background:#ffc857;" title="Gordura"></div>
      </div>
      <div class="grid grid-4" style="margin-top:10px;">
        <div class="stat"><div class="val" style="color:#7c5cff">${Math.round(macros.proteinG)}g</div><div class="lbl">Proteína (${proteinPct}%)</div></div>
        <div class="stat"><div class="val" style="color:#3ddc97">${Math.round(macros.carbG)}g</div><div class="lbl">Carboidrato (${carbPct}%)</div></div>
        <div class="stat"><div class="val" style="color:#ffc857">${Math.round(macros.fatG)}g</div><div class="lbl">Gordura (${fatPct}%)</div></div>
        <div class="stat"><div class="val">${macros.fiberMin}-${macros.fiberMax}g</div><div class="lbl">Fibras</div></div>
      </div>
      <p class="muted" style="margin-top:10px;">Cálculo do ajuste calórico usa a regra ~7700 kcal por kg de tecido para atingir o ritmo semanal escolhido. Ajuste conforme resposta real do seu peso ao longo das semanas.</p>
    </div>
  `;
}

      <h3>Conquistas (${DATA.gami.badges.length}/${BADGE_DEFS.length})</h3>
      <div>
        ${BADGE_DEFS.map(b=>{
          const earned = DATA.gami.badges.includes(b.id);
          return `<span class="badgechip ${earned?'earned':''}" title="${b.desc}">${earned?'🏆':'🔒'} ${b.name}</span>`;
        }).join('')}

    </div>
    <div class="card">
      <h3>Como funciona o XP</h3>
      <table>
        <tr><td>Registrar peso do dia</td><td>+${XP_RULES.weight} XP</td></tr>
        <tr><td>Registrar treino do dia</td><td>+${XP_RULES.training} XP</td></tr>
        <tr><td>Registrar sono</td><td>+${XP_RULES.sleep} XP</td></tr>
        <tr><td>Registrar nota de alimentação</td><td>+${XP_RULES.nutrition} XP</td></tr>
        <tr><td>Nova avaliação de medidas</td><td>+${XP_RULES.measurement} XP</td></tr>
        <tr><td>Nova foto de progresso</td><td>+${XP_RULES.photo} XP</td></tr>
      </table>
      <p class="muted" style="margin-top:10px;">A cada ${LEVEL_STEP} XP você sobe de nível. O streak conta dias seguidos com pelo menos um registro (peso ou check-in diário).</p>
    </div>
  `;
}

/* ---------------- SETTINGS / BACKUP ---------------- */
function renderSettings(c){
  const p = DATA.profile;
  c.innerHTML = `
    <div class="card">
      <h3>Perfil</h3>
      <div class="row">
        <div class="field"><label>Nome</label><input type="text" id="setName" value="${p.name}"></div>
        <div class="field"><label>Sexo</label><select id="setSex"><option value="M" ${p.sex==='M'?'selected':''}>Masculino</option><option value="F" ${p.sex==='F'?'selected':''}>Feminino</option></select></div>
        <div class="field"><label>Altura (cm)</label><input type="number" id="setHeight" value="${p.height}"></div>
        <div class="field"><label>Ano de nascimento</label><input type="number" id="setBirthYear" value="${p.birthYear}"></div>
      </div>
      <button class="btn" id="saveProfile">Salvar perfil</button>
    </div>

    <div class="card">
      <h3>Backup dos dados</h3>
      <p class="muted">Todos os dados ficam salvos apenas neste navegador. Exporte regularmente para não perder seu histórico ao trocar de computador ou limpar o cache.</p>
      <div class="row">
        <button class="btn" id="exportBtn">⬇️ Exportar backup (JSON)</button>
        <label class="btn secondary" style="text-align:center;">⬆️ Importar backup<input type="file" id="importFile" accept=".json" style="display:none;"></label>
      </div>
      <hr class="sep">
      <button class="btn danger" id="resetBtn">🗑️ Apagar todos os dados</button>
    </div>
  `;
  document.getElementById('saveProfile').onclick = ()=>{
    p.name = document.getElementById('setName').value;
    p.sex = document.getElementById('setSex').value;
    p.height = parseFloat(document.getElementById('setHeight').value)||p.height;
    p.birthYear = parseInt(document.getElementById('setBirthYear').value)||p.birthYear;
    saveData();
    alert('Perfil salvo!');
  };
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `fitquest-backup-${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importFile').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!confirm('Isso vai substituir os dados atuais pelos do backup. Continuar?')) return;
        DATA = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), imported);
        saveData();
        render();
        alert('Backup importado com sucesso!');
      }catch(err){ alert('Arquivo inválido: '+err.message); }
    };
    reader.readAsText(file);
  };
  document.getElementById('resetBtn').onclick = ()=>{
    if(!confirm('Isso vai apagar TODOS os dados permanentemente. Tem certeza?')) return;
    if(!confirm('Confirmação final: apagar tudo?')) return;
    localStorage.removeItem(LS_KEY);
    DATA = loadData();
    render();
  };
}

/* ---------------- INIT ---------------- */
checkBadges();
render();
</script>
